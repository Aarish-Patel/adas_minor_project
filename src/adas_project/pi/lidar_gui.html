<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RC Car - Live LiDAR</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1120; color: #e5ecff;
               font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  #status { display: flex; gap: 18px; padding: 10px 16px; background: #111a2e;
            border-bottom: 1px solid #1e2b47; flex-wrap: wrap; align-items: center; }
  .stat { display: flex; flex-direction: column; min-width: 90px; }
  .stat .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 18px; font-weight: 600; }
  .ok { color: #34d399; }
  .blocked { color: #f87171; }
  .mode-badge { margin-left: auto; padding: 4px 12px; border-radius: 999px; font-weight: 600;
                font-size: 13px; background: #1e2b47; border: 1px solid #33415f; }
  .mode-badge.override { background: #7f1d1d; border-color: #f87171; color: #fecaca; }
  .mode-badge.braking { background: #7c2d12; border-color: #fb923c; color: #fed7aa; }
  #overrideBtn { padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px;
                 border: 1px solid #33415f; background: #1e2b47; color: #e5ecff; cursor: pointer;
                 transition: background 0.15s, border-color 0.15s; }
  #overrideBtn:hover { background: #263452; }
  #overrideBtn.active { background: #b91c1c; border-color: #f87171; color: #fff; }
  #followBtn { padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px;
               border: 1px solid #33415f; background: #1e2b47; color: #e5ecff; cursor: pointer;
               transition: background 0.15s, border-color 0.15s; }
  #followBtn:hover { background: #263452; }
  #followBtn.active { background: #1d4ed8; border-color: #60a5fa; color: #fff; }
  #overrideBanner { display: none; text-align: center; padding: 6px; background: #7f1d1d;
                     color: #fecaca; font-weight: 700; letter-spacing: .05em; font-size: 13px; }
  #overrideBanner.show { display: block; }
  #canvasWrap { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #testPanel { display: none; position: absolute; left: 14px; top: 12px; width: 380px; max-width: 46vw;
               background: rgba(17,26,46,0.92); border: 1px solid #33415f; border-radius: 10px;
               padding: 10px 12px; font-size: 12px; line-height: 1.45; }
  #testPanel.show { display: block; }
  #testPanel .tt { font-size: 15px; font-weight: 700; color: #60a5fa; }
  #testPanel .tm { color: #e5ecff; margin: 2px 0 6px; }
  #testBar { height: 5px; background: #1e2b47; border-radius: 3px; margin-bottom: 6px; }
  #testBar > div { height: 100%; background: #34d399; border-radius: 3px; width: 0; transition: width .3s; }
  #testLog { font-family: Consolas, monospace; color: #94a3b8; white-space: pre-wrap; max-height: 230px; overflow: hidden; }
  #assistBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1e2b47; }
  #assistBar .lbl { font-size: 12px; color: #94a3b8; margin-right: 4px; }
  .aBtn { padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; border: 1px solid #33415f;
          background: #1e2b47; color: #cbd5f5; cursor: pointer; }
  .aBtn.on { background: #047857; border-color: #34d399; color: #fff; }
  #assistInfo { position: absolute; left: 14px; bottom: 12px; max-width: 60vw; font-size: 14px; font-weight: 700;
                color: #facc15; background: rgba(17,26,46,0.85); border-radius: 8px; padding: 6px 10px; display: none; }
  #assistInfo.warn { color: #fca5a5; }
  #conn { position: absolute; top: 10px; right: 14px; font-size: 12px; color: #f87171; }
</style>
</head>
<body>
<div id="wrap">
  <div id="overrideBanner">ADAS OVERRIDE ACTIVE - SAFETY GATE DISABLED, FULL MANUAL CONTROL</div>
  <div id="status">
    <div class="stat"><span class="label">Front</span><span class="value" id="front">--</span></div>
    <div class="stat"><span class="label">Rear</span><span class="value" id="rear">--</span></div>
    <div class="stat"><span class="label">Body front</span><span class="value" id="bodyFront">--</span></div>
    <div class="stat"><span class="label">Body rear</span><span class="value" id="bodyRear">--</span></div>
    <div class="stat"><span class="label">Steer</span><span class="value" id="steer">--</span></div>
    <div class="stat"><span class="label">PWM sent</span><span class="value" id="pwm">--</span></div>
    <div class="stat"><span class="label">Tracked objs</span><span class="value" id="tracks">--</span></div>
    <div class="mode-badge" id="mode">MANUAL</div>
    <button id="followBtn">FOLLOW MODE: OFF</button>
    <button id="overrideBtn">ADAS OVERRIDE: OFF</button>
  </div>
  <div id="assistBar"><span class="lbl">DRIVING ASSISTS</span>
    <button class="aBtn" data-a="evasive">Evasive steer</button>
    <button class="aBtn" data-a="centring">Corridor centring</button>
    <button class="aBtn" data-a="limiter">Speed/steer limiter</button>
    <button class="aBtn" data-a="narrow">Narrow gap</button>
    <button class="aBtn" data-a="proximity">Side/rear alerts</button>
    <button class="aBtn" data-a="all" data-all="on">All on</button>
    <button class="aBtn" data-a="all" data-all="off">All off</button>
    <span class="lbl" style="margin-left:14px">AUTONOMY</span>
    <span id="navHint" style="font-size:12px;color:#94a3b8">click the map to drive there (hold the throttle)</span>
    <button class="aBtn" id="navCancel" style="display:none">Cancel</button>
    <span id="simBar" style="display:none;margin-left:auto;font-size:12px;color:#94a3b8">SIMULATOR <b id="simWorld"></b>
      &nbsp;crashes <b id="simCrashes">0</b>&nbsp; <button class="aBtn" id="simReset">RESET CAR</button></span>
  </div>
  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="testPanel"><div class="tt" id="testTitle"></div><div id="testActivity" style="font-weight:700;color:#facc15;margin-top:2px"></div><div id="testServo" style="color:#e5ecff"></div><div id="testAlert" style="font-weight:700;color:#f87171"></div><div class="tm" id="testMsg"></div><div id="testBar"><div id="testBarFill"></div></div><div id="testLog"></div></div>
    <div id="assistInfo"></div>
    <div id="conn"></div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

const MAX_RANGE_M = 3.0;   // outer ring of the view
const CAR_LEN_M = 0.20, CAR_WID_M = 0.14;   // (legacy)
const BODY_FRONT_M = 0.16, BODY_REAR_M = 0.17, BODY_HALF_W_M = 0.10;   // measured from the LiDAR

function draw(data) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const scale = Math.min(w, h) / (2 * MAX_RANGE_M) * 0.92;
  view = { cx, cy, scale };

  // range rings
  ctx.strokeStyle = '#1e2b47';
  ctx.lineWidth = 1;
  for (let r = 1; r <= MAX_RANGE_M; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#334155';
    ctx.font = `${11 * devicePixelRatio}px sans-serif`;
    ctx.fillText(r + 'm', cx + 4, cy - r * scale - 4);
  }
  // crosshair
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
  ctx.moveTo(0, cy); ctx.lineTo(w, cy);
  ctx.strokeStyle = '#16213a';
  ctx.stroke();

  // front/rear cones (+-25deg), tinted red if blocked
  function cone(centerDeg, halfDeg, blocked) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    const a0 = (centerDeg - halfDeg - 90) * Math.PI / 180;
    const a1 = (centerDeg + halfDeg - 90) * Math.PI / 180;
    ctx.arc(cx, cy, MAX_RANGE_M * scale, a0, a1);
    ctx.closePath();
    ctx.fillStyle = blocked ? 'rgba(248,113,113,0.18)' : 'rgba(52,211,153,0.07)';
    ctx.fill();
  }
  cone(0, 25, data.front_blocked);
  cone(180, 25, data.rear_blocked);

  const P = (a, d) => { const r = (a - 90) * Math.PI / 180; return [cx + Math.cos(r) * d * scale, cy + Math.sin(r) * d * scale]; };
  function poly(pts, color, width, dash) {
    if (!pts || pts.length < 2) return;
    ctx.beginPath();
    pts.forEach(([a, d], i) => { const [x, y] = P(a, d); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.strokeStyle = color; ctx.lineWidth = width * devicePixelRatio;
    ctx.setLineDash(dash ? dash.map(v => v * devicePixelRatio) : []);
    ctx.stroke(); ctx.setLineDash([]);
  }
  // simulator only: the true walls, under the scan
  if (data.sim) for (const wpts of (data.sim.walls || [])) poly(wpts, '#475569', 3);

  // LiDAR points - bearing 0 = up (car's front), car-frame angle convention matches the relay
  ctx.fillStyle = '#60a5fa';
  for (const [angleDeg, distM] of (data.points || [])) {
    if (distM > MAX_RANGE_M) continue;
    const rad = (angleDeg - 90) * Math.PI / 180;
    const px = cx + Math.cos(rad) * distM * scale;
    const py = cy + Math.sin(rad) * distM * scale;
    ctx.beginPath();
    ctx.arc(px, py, 2 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
  }

  // tracked objects (adas/tracking.py, vehicle frame: x forward from the rear axle, y left) -
  // shift by LIDAR_X_M to plot in the same LiDAR-centred space as the point cloud above
  const LIDAR_X_M = 0.12, LIDAR_Y_M = 0.0;
  for (const tr of (data.tracks || [])) {
    const lx = tr.x - LIDAR_X_M, ly = tr.y - LIDAR_Y_M;
    const px = cx - ly * scale, py = cy - lx * scale;
    ctx.beginPath();
    ctx.arc(px, py, (tr.moving ? 7 : 5) * devicePixelRatio, 0, Math.PI * 2);
    ctx.fillStyle = tr.moving ? '#fb923c' : '#a78bfa';
    ctx.fill();
    if (tr.moving) {
      ctx.strokeStyle = '#fb923c';
      ctx.lineWidth = 1.5 * devicePixelRatio;
      ctx.stroke();
    }
  }

  // predicted path (where the body will go at the current stick/throttle) and any planned manoeuvre
  const plan = data.plan;
  if (plan) {
    if (plan.line) poly(plan.line, '#94a3b8', 1.5, [6, 6]);                 // the original line
    if (plan.maneuver) poly(plan.maneuver, data.nav && data.nav.state !== 'idle' ? '#a78bfa' : '#22d3ee', 3);  // planned path
    const col = plan.state === 'collision' ? '#f87171' : plan.state === 'limited' ? '#facc15' : '#34d399';
    if (plan.left) poly(plan.left, col, 1.5, [3, 4]);                       // the swept body edges
    if (plan.right) poly(plan.right, col, 1.5, [3, 4]);
    if (plan.pred) poly(plan.pred, col, 2.5);
    if (plan.hit) {                                                          // where the body would touch: X
      const [x, y] = P(plan.hit[0], plan.hit[1]), k = 9 * devicePixelRatio;
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4 * devicePixelRatio;
      ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke();
      if (plan.ttc != null) {
        ctx.fillStyle = '#fecaca'; ctx.font = `bold ${12 * devicePixelRatio}px sans-serif`;
        ctx.fillText(`${plan.hit_m.toFixed(2)} m  /  ${plan.ttc.toFixed(1)} s`, x + k + 4, y + 4);
      }
    }
  }

  // autonomy goal
  if (data.nav && data.nav.goal) {
    const [x, y] = P(data.nav.goal[0], data.nav.goal[1]), r = 10 * devicePixelRatio;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      i ? ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)) : ctx.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
    }
    ctx.closePath(); ctx.fillStyle = '#a78bfa'; ctx.fill();
  }

  // car outline: the measured body around the LiDAR (front 16 cm, rear 17 cm, 20 cm wide), front pointing up
  ctx.save();
  ctx.translate(cx, cy);
  const steerAvg = ((data.steer_a1 ?? 90) + (data.steer_a2 ?? 90)) / 2 - 90;
  const crashed = data.sim && data.sim.crashed;
  ctx.fillStyle = crashed ? '#ef4444' : (data.body_alert_front || data.body_alert_rear) ? '#f87171' : '#e5ecff';
  ctx.globalAlpha = 0.85;
  ctx.fillRect(-BODY_HALF_W_M * scale, -BODY_FRONT_M * scale, 2 * BODY_HALF_W_M * scale, (BODY_FRONT_M + BODY_REAR_M) * scale);
  ctx.globalAlpha = 1;
  // steering indicator line from the front
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 2 * devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(0, -BODY_FRONT_M * scale);
  const steerRad = steerAvg * Math.PI / 180 * 0.6;
  ctx.lineTo(Math.sin(steerRad) * 18 * devicePixelRatio, -BODY_FRONT_M * scale - Math.cos(steerRad) * 18 * devicePixelRatio);
  ctx.stroke();
  ctx.restore();
  if (crashed) {
    ctx.fillStyle = '#ef4444'; ctx.font = `bold ${26 * devicePixelRatio}px sans-serif`;
    ctx.fillText('CRASH', cx - 45 * devicePixelRatio, cy + 60 * devicePixelRatio);
  }
}

function fmt(v, unit) { return (v === null || v === undefined) ? '--' : v.toFixed(2) + (unit || ''); }

const overrideBtn = document.getElementById('overrideBtn');
const overrideBanner = document.getElementById('overrideBanner');
let overrideOn = false;   // reflects the server's reported state, not a local guess
let togglePending = false;

overrideBtn.addEventListener('click', async () => {
  if (togglePending) return;
  togglePending = true;
  const target = !overrideOn;
  try {
    await fetch(`/api/override/${target ? 'on' : 'off'}`, { method: 'POST' });
  } catch (e) { /* next poll will just show the actual server state */ }
  togglePending = false;
});

const followBtn = document.getElementById('followBtn');
let followOn = false;
let followTogglePending = false;
followBtn.addEventListener('click', async () => {
  if (followTogglePending) return;
  followTogglePending = true;
  const target = !followOn;
  try {
    await fetch(`/api/follow/${target ? 'on' : 'off'}`, { method: 'POST' });
  } catch (e) { /* next poll will just show the actual server state */ }
  followTogglePending = false;
});

function applyMode(data) {
  overrideOn = data.mode === 'override';
  overrideBtn.textContent = `ADAS OVERRIDE: ${overrideOn ? 'ON' : 'OFF'}`;
  overrideBtn.classList.toggle('active', overrideOn);
  overrideBanner.classList.toggle('show', overrideOn);

  followOn = !!data.follow_enabled;
  followBtn.textContent = data.follow_lead
    ? `FOLLOW: gap ${data.follow_lead[0].toFixed(2)}m` : `FOLLOW MODE: ${followOn ? 'ON' : 'OFF'}`;
  followBtn.classList.toggle('active', followOn);

  const modeEl = document.getElementById('mode');
  if (overrideOn) {
    modeEl.textContent = 'OVERRIDE'; modeEl.className = 'mode-badge override';
  } else if (data.braking) {
    modeEl.textContent = 'BRAKING'; modeEl.className = 'mode-badge braking';
  } else if (data.moving_blocked) {
    modeEl.textContent = 'MOVING OBJ'; modeEl.className = 'mode-badge braking';
  } else if (data.follow_lead) {
    modeEl.textContent = 'FOLLOWING'; modeEl.className = 'mode-badge';
  } else {
    modeEl.textContent = (data.mode || 'manual').toUpperCase(); modeEl.className = 'mode-badge';
  }
}

let assistEnabled = {};
document.querySelectorAll('.aBtn').forEach(b => b.addEventListener('click', async () => {
  const name = b.dataset.a;
  const on = name === 'all' ? b.dataset.all === 'on' : !assistEnabled[name];
  try { await fetch(`/api/assist/${name}/${on ? 'on' : 'off'}`, { method: 'POST' }); } catch (e) {}
}));
document.getElementById('simReset').addEventListener('click', () => fetch('/api/sim/reset', { method: 'POST' }));

// click-to-go: a click on the map is a goal in the vehicle frame (x forward from the rear axle, y left)
let view = null;
const LIDAR_X = 0.12;
canvas.addEventListener('click', ev => {
  if (!view) return;
  const r = canvas.getBoundingClientRect();
  const px = (ev.clientX - r.left) * devicePixelRatio, py = (ev.clientY - r.top) * devicePixelRatio;
  const fwd = (view.cy - py) / view.scale, left = (view.cx - px) / view.scale;
  fetch(`/api/goto/${(LIDAR_X + fwd).toFixed(3)}/${left.toFixed(3)}`, { method: 'POST' }).catch(() => {});
});
document.getElementById('navCancel').addEventListener('click', () => fetch('/api/goto/cancel', { method: 'POST' }));
function applyNav(data) {
  const n = data.nav || { state: 'idle', msg: '' };
  document.getElementById('navCancel').style.display = n.state !== 'idle' ? 'inline' : 'none';
  document.getElementById('navHint').textContent = n.state !== 'idle' ? `${n.state}: ${n.msg}` :
    (n.msg ? `${n.msg} - click the map for a new goal` : 'click the map to drive there (hold the throttle)');
}
function applySim(data) {
  const bar = document.getElementById('simBar');
  bar.style.display = data.sim ? 'inline' : 'none';
  if (data.sim) {
    document.getElementById('simWorld').textContent = data.sim.world || '';
    document.getElementById('simCrashes').textContent = data.sim.crashes || 0;
  }
}
function applyAssists(data) {
  const a = data.assist || {};
  assistEnabled = a.enabled || {};
  document.querySelectorAll('.aBtn[data-a]').forEach(b => {
    if (b.dataset.a !== 'all') b.classList.toggle('on', !!assistEnabled[b.dataset.a]);
  });
  const box = document.getElementById('assistInfo');
  const lines = Object.values(a.info || {});
  box.style.display = lines.length ? 'block' : 'none';
  box.textContent = lines.join('  |  ');
  box.classList.toggle('warn', (a.level || 0) >= 2);
}

async function poll() {
  try {
    const res = await fetch('/api/scan', { cache: 'no-store' });
    const data = await res.json();
    document.getElementById('conn').textContent = '';

    const front = document.getElementById('front');
    front.textContent = fmt(data.front_dist, 'm');
    front.className = 'value ' + (data.front_blocked ? 'blocked' : 'ok');

    const rear = document.getElementById('rear');
    rear.textContent = fmt(data.rear_dist, 'm');
    rear.className = 'value ' + (data.rear_blocked ? 'blocked' : 'ok');

    const bodyFront = document.getElementById('bodyFront');
    bodyFront.textContent = fmt(data.body_min_front, 'm');
    bodyFront.className = 'value ' + (data.body_alert_front ? 'blocked' : 'ok');

    const bodyRear = document.getElementById('bodyRear');
    bodyRear.textContent = fmt(data.body_min_rear, 'm');
    bodyRear.className = 'value ' + (data.body_alert_rear ? 'blocked' : 'ok');

    document.getElementById('steer').textContent =
      data.steer_a1 != null ? Math.round((data.steer_a1 + data.steer_a2) / 2) + '°' : '--';
    document.getElementById('pwm').textContent = data.pwm_sent ?? '--';
    const tracks = data.tracks || [];
    const moving = tracks.filter(t => t.moving).length;
    document.getElementById('tracks').textContent = `${tracks.length} (${moving} moving)`;
    const tp = document.getElementById('testPanel');
    if (data.test && data.test.title) {
      tp.classList.add('show');
      document.getElementById('testTitle').textContent = data.test.title;
      document.getElementById('testMsg').textContent = data.test.message || '';
      document.getElementById('testActivity').textContent = data.test.activity ? ('>> ' + data.test.activity) : '';
      document.getElementById('testServo').textContent = data.test.servo == null ? '' :
        `servo ${data.test.servo.toFixed(1)}°  =  wheel offset ${(data.test.servo - 90 >= 0 ? '+' : '') + (data.test.servo - 90).toFixed(1)}° from center`;
      document.getElementById('testAlert').textContent = data.test.scan_ok === false ? 'LIDAR: no fresh scan' : (data.test.alert || '');
      document.getElementById('testBarFill').style.width = data.test.progress == null ? '0%' : (data.test.progress * 100) + '%';
      document.getElementById('testLog').textContent = (data.test.log || []).join(String.fromCharCode(10));
    } else { tp.classList.remove('show'); }
    applyMode(data);
    applyAssists(data);
    applySim(data);
    applyNav(data);

    draw(data);
  } catch (e) {
    document.getElementById('conn').textContent = 'connection lost';
  }
  setTimeout(poll, 150);
}
poll();
</script>
</body>
</html>
